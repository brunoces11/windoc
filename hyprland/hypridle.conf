general {
    lock_cmd = omarchy system lock
    after_sleep_cmd = omarchy system wake
    ignore_dbus_inhibit = false
}

listener {
    timeout = 900                                 # 15 minutos
    on-timeout = omarchy-brightness-display off   # Desliga o monitor apos 15 min de inatividade
    on-resume = omarchy-system-wake               # Liga o monitor ao detectar atividade
}
