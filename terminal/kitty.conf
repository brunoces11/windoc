# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Font
# font_family JetBrainsMono Nerd Font
# font_size 12

# Window padding
# window_padding_width 14

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes

# Ctrl+V pastes clipboard text in Kitty. Ctrl+Shift+V sends Ctrl+V to the
# foreground app, so Codex can use its image-from-clipboard paste handler.
# Ctrl+C copies selected text; with no selection it still sends SIGINT.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+v send_text all \x16

# Detecta caminhos de arquivo em texto puro no scrollback (saida de IA, logs, etc.)
# e os torna clicaveis/selecionaveis como hyperlink, abrindo no editor via
# open-actions.conf. Funciona sobre QUALQUER texto na tela, independente de
# qual programa gerou (Claude Code, Codex, Antigravity, cat, etc.), porque
# escaneia o buffer renderizado, nao a origem do texto.
#   ctrl+shift+p depois p: abre o path selecionado
#   ctrl+shift+p depois o: abre a URL/path e sai do modo hints
map ctrl+shift+p>p kitten hints --type=path --program=-
map ctrl+shift+p>o kitten hints --type=path

# Gerenciamento de abas (Tabs)
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Top bar configuration (compact title bar with dynamic session & agent icons)
tab_bar_edge            top
tab_bar_min_tabs        1
tab_bar_style           custom
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0
active_tab_font_style   bold
inactive_tab_font_style normal

font_size 8.0

# Barra de rolagem lateral (Scrollbar para telas com muito texto / scrollback)
scrollbar                   always
scrollbar_interactive       yes
scrollbar_jump_on_click     yes
scrollbar_width             0.5
scrollbar_hover_width       1.0
scrollbar_handle_opacity    0.6
scrollbar_track_opacity     0.15
scrollbar_track_hover_opacity 0.25
