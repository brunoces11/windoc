# Abre arquivos de texto detectados pelo hints kitten (ou por hyperlink OSC 8)
# diretamente no editor padrao do sistema ($EDITOR), numa janela overlay do kitty.
#
# Isso cobre tanto:
#  - paths de texto puro escaneados via `kitty +kitten hints --type=path`
#  - links OSC 8 reais (quando algum programa já os emite)
#
# Referencia: https://sw.kovidgoyal.net/kitty/open_actions/

# Qualquer arquivo de texto comum (scripts, configs, markdown, etc.)
protocol file
mime text/*
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}

# Extensoes que o mimetypes do Python pode nao reconhecer como text/* por padrao
protocol file
ext ps1
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}

protocol file
ext sh
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}

protocol file
ext conf
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}

protocol file
ext yml
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}

protocol file
ext yaml
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}

protocol file
ext json
action launch --type=overlay --title="Editor: ${FILE_PATH}" $EDITOR ${FILE_PATH}
